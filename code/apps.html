<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Apps</title>
<script>
// Apply theme BEFORE paint to avoid a flash of the wrong mode. Dark is the default.
(function(){
  var c = document.cookie, m;
  if((m = c.match(/(?:^|; )theme=(light|dark)/)) && m[1] === "light"){
    document.documentElement.classList.add("light");
  }
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<style>
  :root{
    --bg:#0f1115; --panel:#171a20; --border:#262b34; --text:#e6e8ec; --muted:#8b93a1;
    --accent:#3b82f6; --accent-soft:#1e2a44; --ok:#22c55e; --bad:#ef4444; --warn:#d97706;
    --term:#0b0d10; --term-text:#d7dae0;
  }
  html.light{
    --bg:#f4f5f7; --panel:#fff; --border:#e4e6ea; --text:#1c1e21; --muted:#6b7280;
    --accent-soft:#e8f0fe;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
  header{background:var(--panel);border-bottom:1px solid var(--border);padding:14px 20px;flex:0 0 auto;
      display:flex;align-items:center;justify-content:space-between}
  header h1{margin:0;font-size:18px;font-weight:600}
  header span{color:var(--muted);font-size:13px;margin-left:8px}
  .header-right{display:flex;align-items:center;gap:8px}
  .login-btn{text-decoration:none;font-size:13px;font-weight:600;color:var(--accent);
      border:1px solid var(--accent);padding:6px 14px;border-radius:8px}
  .login-btn:hover{background:var(--accent-soft)}
  .theme-toggle{border:1px solid var(--border);background:var(--panel);color:var(--text);
      font-size:16px;line-height:1;padding:6px 10px;border-radius:8px;cursor:pointer}
  .theme-toggle:hover{background:var(--bg)}

  .wrap{flex:1 1 auto;display:flex;min-height:0}

  /* ---- sidebar ---- */
  nav{width:290px;flex:0 0 auto;background:var(--panel);border-right:1px solid var(--border);
      overflow-y:auto;display:flex;flex-direction:column}
  nav .nav-head{display:flex;align-items:center;justify-content:space-between;gap:8px;
      padding:12px 16px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;
      color:var(--muted);border-bottom:1px solid var(--border)}
  .nav-sorts{display:flex;gap:4px}
  .sort-btn{border:1px solid var(--border);background:none;color:var(--muted);
      font-size:10px;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;
      border-radius:6px;cursor:pointer;font-family:inherit}
  .sort-btn:hover{background:var(--bg);color:var(--text)}
  .sort-btn.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .nav-search{width:100%;border:1px solid var(--border);border-radius:8px;padding:6px 10px;
      font-size:13px;background:var(--bg);color:var(--text);margin-top:10px;font-family:inherit}
  .nav-search:focus{outline:none;border-color:var(--accent)}
  .nav-search::placeholder{color:var(--muted)}
  .nav-empty{padding:18px 16px;font-size:12px;color:var(--muted)}
  .item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;
      padding:11px 16px;cursor:pointer;font-size:14px;color:var(--text);border-bottom:1px solid var(--border)}
  .item:hover{background:var(--bg)}
  .item.active{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
  .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(34,197,94,.18)}
  .dot.off{background:var(--bad)}
  .item-body{flex:1 1 auto;display:flex;flex-direction:column;min-width:0}
  .item .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
  .item .stats{font-size:11px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .port{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}

  /* ---- main ---- */
  main{flex:1 1 auto;overflow-y:auto;padding:24px 28px}
  .empty{color:var(--muted);margin-top:40vh;text-align:center}
  .card-head{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:18px}
  .card-head h2{margin:0;font-size:22px;font-weight:600}
  .badge{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
  .badge.on{background:rgba(34,197,94,.15);color:var(--ok)}
  .badge.off{background:rgba(239,68,68,.15);color:var(--bad)}
  .meta{color:var(--muted);font-size:13px}
  .openbtn{text-decoration:none;font-size:13px;font-weight:600;color:#fff;
      background:var(--accent);padding:8px 14px;border-radius:8px}
  .openbtn:hover{filter:brightness(1.08)}
  .chatbtn{text-decoration:none;font-size:13px;font-weight:600;color:var(--accent);
      border:1px solid var(--accent);padding:8px 14px;border-radius:8px}
  .chatbtn:hover{background:var(--accent-soft)}

  /* ---- control buttons ---- */
  .controls{display:flex;gap:8px}
  .ctl{border:1px solid var(--border);background:var(--panel);color:var(--text);
      font-size:13px;font-weight:600;padding:7px 12px;border-radius:8px;cursor:pointer}
  .ctl:hover{background:var(--bg)}
  .ctl:disabled{opacity:.5;cursor:not-allowed}
  .ctl.run{color:var(--ok);border-color:rgba(34,197,94,.4)}
  .ctl.run:hover{background:rgba(34,197,94,.1)}
  .ctl.stop{color:var(--warn);border-color:rgba(217,119,6,.4)}
  .ctl.stop:hover{background:rgba(217,119,6,.1)}
  .ctl.remove{color:var(--bad);border-color:rgba(239,68,68,.4)}
  .ctl.remove:hover{background:rgba(239,68,68,.1)}

  /* ---- app controls row (PID/CPU/MEM/DISK + subdomain + public) ---- */
  .app-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:8px 12px;
      display:flex;flex-direction:column;gap:3px;min-width:80px}
  .stat .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .stat .val{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
  .sep{width:1px;align-self:stretch;background:var(--border);margin:2px 2px}
  .ctrl-group{display:flex;gap:8px;align-items:center}
  .ctrl-label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .domain-input{width:160px;border:1px solid var(--border);border-radius:8px;padding:6px 10px;
      font-size:13px;background:var(--bg);color:var(--text);min-width:0}
  .domain-input:focus{outline:none;border-color:var(--accent)}
  .domain-save{border:1px solid var(--accent);background:var(--accent);color:#fff;font-size:12px;
      font-weight:600;padding:6px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
  .domain-save:hover{filter:brightness(1.08)}
  .domain-save:disabled{opacity:.5;cursor:not-allowed}
  .switch{position:relative;width:40px;height:22px;flex:0 0 auto;border:0;padding:0;border-radius:999px;
      background:var(--border);cursor:pointer;transition:background .15s}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;
      background:#fff;transition:left .15s}
  .switch.on{background:var(--ok)}
  .switch.on::after{left:21px}
  .switch:disabled{opacity:.5;cursor:not-allowed}
  .pub-label{font-size:13px;color:var(--text);font-weight:500}
  .pub-state{font-size:12px;color:var(--muted)}

  /* ---- toast ---- */
  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);
      background:var(--panel);border:1px solid var(--border);color:var(--text);
      padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;
      transition:opacity .2s,transform .2s;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.35);
      max-width:80vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.ok{border-color:rgba(34,197,94,.5)}
  #toast.err{border-color:rgba(239,68,68,.5)}

  .section-label{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:24px 0 8px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px}
  .tail{background:var(--term);color:var(--term-text);border-radius:12px;padding:16px 18px;
      font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.5;
      white-space:pre;overflow:auto;max-height:46vh;margin:0}

  /* ---- rendered readme ---- */
  .readme{padding:16px 20px;font-size:14px;line-height:1.6;overflow-wrap:break-word}
  .readme h1{font-size:20px;margin:.5em 0 .4em;padding-bottom:.3em;border-bottom:1px solid var(--border)}
  .readme h2{font-size:17px;margin:.6em 0 .35em}
  .readme h3{font-size:15px;margin:.6em 0 .3em}
  .readme p{margin:.5em 0}
  .readme a{color:var(--accent)}
  .readme ul,.readme ol{padding-left:1.4em;margin:.5em 0}
  .readme code{background:var(--bg);border:1px solid var(--border);border-radius:5px;
      padding:.1em .35em;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9em}
  .readme pre{background:var(--term);color:var(--term-text);border-radius:10px;padding:14px 16px;
      overflow:auto;margin:.6em 0}
  .readme pre code{background:none;border:0;padding:0;color:inherit}
  .readme blockquote{margin:.5em 0;padding:.2em 1em;border-left:3px solid var(--border);color:var(--muted)}
  .readme table{border-collapse:collapse;margin:.6em 0;font-size:13px}
  .readme th,.readme td{border:1px solid var(--border);padding:6px 10px}
  .readme img{max-width:100%}

  /* ---- mobile ---- */
  @media (max-width:768px){
    body{overflow:auto}
    .wrap{flex-direction:column;min-height:0}
    nav{width:100%;flex:0 0 auto;border-right:0;border-bottom:1px solid var(--border);
        flex-direction:row;overflow-x:auto;overflow-y:hidden}
    nav .nav-head{display:none}
    .item{flex:0 0 auto;width:auto;border-bottom:0;border-right:1px solid var(--border);padding:10px 16px}
    .item.active{box-shadow:inset 0 -3px 0 var(--accent)}
    main{padding:18px}
    .tail{max-height:40vh}
    .card-head{gap:8px}
    .openbtn,.chatbtn,.controls{margin-left:0}
  }
</style>
</head>
<body>
  <header>
    <h1>Apps<span id="count"></span></h1>
    <div class="header-right">
      <a id="loginBtn" class="login-btn" href="/login" style="display:none">Login</a>
      <button id="themeToggle" class="theme-toggle" title="Switch theme">🌙</button>
    </div>
  </header>
  <div class="wrap">
    <nav id="nav">
      <div class="nav-head">
        <span>Apps</span>
        <span class="nav-sorts">
          <button class="sort-btn" data-sort="status">Status</button>
          <button class="sort-btn" data-sort="ram">RAM</button>
          <button class="sort-btn" data-sort="disk">Disk</button>
        </span>
        <input id="searchInput" class="nav-search" type="search" placeholder="Filter apps… (name, port, sub)" spellcheck="false" autocomplete="off">
      </div>
    </nav>
    <main id="main"><div class="empty">No apps yet.</div></main>
  </div>
  <div id="toast"></div>

<script>
const APPS = __APPS__;
// Injected by the server as an int (the viewer's user id). 0 = anonymous.
// The typeof guard means an unreplaced token degrades to "anonymous" instead of a
// ReferenceError taking down the whole page.
const USER_ID = (typeof __USER_ID__ === "undefined") ? 0 : (Number(__USER_ID__) || 0);
const nav  = document.getElementById("nav");
const main = document.getElementById("main");
let selected = null;
let current  = null;   // app object shown in the main pane

// ---------------- login (anonymous user -> /login button) ----------------
if(USER_ID === 0){
  document.getElementById("loginBtn").style.display = "";
}

// ---------------- theme (cookie-backed) ----------------
const themeBtn = document.getElementById("themeToggle");
function isLight(){ return document.documentElement.classList.contains("light"); }
function updateThemeBtn(){
  themeBtn.textContent = isLight() ? "☀️" : "🌙";
  themeBtn.title = isLight() ? "Switch to dark mode" : "Switch to light mode";
}
function toggleTheme(){
  const light = !isLight();
  document.documentElement.classList.toggle("light", light);
  document.cookie = "theme=" + (light ? "light" : "dark") + ";path=/;max-age=31536000;SameSite=Lax";
  updateThemeBtn();
}
themeBtn.onclick = toggleTheme;
updateThemeBtn();

// ---------------- formatters ----------------
const esc = s => (s || "").toString()
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;").replace(/'/g,"&#39;");

function fmtCpu(c){ return (c == null || isNaN(c)) ? "—" : Number(c).toFixed(1) + "%"; }
function fmtMem(bytes){
  if(bytes == null || isNaN(bytes)) return "—";
  const u = ["B","KB","MB","GB","TB"];
  let i = 0, n = Number(bytes);
  while(n >= 1024 && i < u.length - 1){ n /= 1024; i++; }
  return (i === 0 ? n : n.toFixed(1)) + " " + u[i];
}

// ---------------- toast ----------------
let toastTimer = null;
function showToast(msg, ok){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "show " + (ok === false ? "err" : "ok");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.className = ""; }, 2600);
}

// ---------------- ANSI -> HTML (2-pass) ----------------
const ANSI = {
  fg: {30:"#4b5563",31:"#ef4444",32:"#22c55e",33:"#eab308",34:"#3b82f6",35:"#a855f7",36:"#06b6d4",37:"#9ca3af",
       90:"#9ca3af",91:"#f87171",92:"#4ade80",93:"#facc15",94:"#60a5fa",95:"#c084fc",96:"#22d3ee",97:"#e5e7eb"},
  bg: {40:"#1f2937",41:"#7f1d1d",42:"#14532d",43:"#713f12",44:"#1e3a8a",45:"#581c87",46:"#164e63",47:"#374151",
       100:"#374151",101:"#991b1b",102:"#166534",103:"#854d0e",104:"#1e40af",105:"#6b21a8",106:"#155e75",107:"#4b5563"}
};

function color256(n){
  if(n < 16) return n < 8 ? ANSI.fg[30+n] : ANSI.fg[90+n];
  if(n < 232){
    const i = n - 16;
    const c = v => v === 0 ? 0 : v * 40 + 55;
    return `rgb(${c(Math.floor(i/36))},${c(Math.floor(i%36/6))},${c(i%6)})`;
  }
  const g = (n - 232) * 10 + 8;
  return `rgb(${g},${g},${g})`;
}

function ansiToHtml(text, stage=0){
  // why this convoluted code lmao? Well qwen3.8:27b gave me both version. Upper version has the color, but doesn't consume ansi sequences, and lower version consumes, but doesn't have colors. So I just pass it through 2 times, each using 1 replace strategy lmao
  if (stage == 1){
    text = text
      .replace(/\x1b\][\s\S]*?(\x07|\x1b\\)/g, "")
      .replace(/\x1b\[[\x20-\x3f]*[\x40-\x6c\x6e-\x7e]/g, "");
  } else {
    // Pass 1 (stage 1) renders SGR -> colored <span> HTML. Pass 2 just strips any
    // leftover OSC / non-SGR CSI, then RETURNS without re-running the SGR machine,
    // so the spans pass 1 produced stay intact (applied) instead of being escaped.
    return ansiToHtml(text, 1)
      .replace(/\x1b\][\s\S]*?(\x07|\x1b\\)/g, "")
      .replace(/\x1b[\[()][0-9;:]*[A-Za-z](?!m)/g, "");
  }

  const SGR = /\x1b\[([0-9;]*)m/g;
  let fg = null, bg = null, a = {}, last = 0, out = "";

  const style = () => {
    const s = [];
    let f = fg, b = bg;
    if(a.inverse){ [f, b] = [b, f]; if(!f) f = "#16181d"; }
    if(f) s.push("color:" + f);
    if(b) s.push("background:" + b);
    if(a.bold) s.push("font-weight:600");
    if(a.dim) s.push("opacity:.65");
    if(a.italic) s.push("font-style:italic");
    if(a.underline) s.push("text-decoration:underline");
    if(a.strike) s.push("text-decoration:line-through");
    return s.join(";");
  };

  const flush = (i) => {
    const txt = text.slice(last, i);
    if(!txt) return;
    const e = txt.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    const st = style();
    out += st ? `<span style="${st}">${e}</span>` : e;
    last = i;
  };

  let m;
  SGR.lastIndex = 0;
  while((m = SGR.exec(text))){
    flush(m.index);
    const p = m[1].split(";").map(Number);
    for(let i = 0; i < p.length; i++){
      const c = p[i] || 0;
      if(c === 0){ fg = bg = null; a = {}; }
      else if(c === 1) a.bold = true;
      else if(c === 2) a.dim = true;
      else if(c === 3) a.italic = true;
      else if(c === 4) a.underline = true;
      else if(c === 7) a.inverse = true;
      else if(c === 9) a.strike = true;
      else if(c === 21 || c === 22){ a.bold = false; a.dim = false; }
      else if(c === 23) a.italic = false;
      else if(c === 24) a.underline = false;
      else if(c === 27) a.inverse = false;
      else if(c === 29) a.strike = false;
      else if(c === 39) fg = null;
      else if(c === 49) bg = null;
      else if(c === 38 || c === 48){
        const isFg = c === 38;
        if(p[i+1] === 5){
          const v = color256(p[i+2] || 0);
          if(isFg) fg = v; else bg = v;
          i += 2;
        } else if(p[i+1] === 2){
          const v = `rgb(${p[i+2]},${p[i+3]},${p[i+4]})`;
          if(isFg) fg = v; else bg = v;
          i += 4;
        }
      }
      else if(ANSI.fg[c] != null) fg = ANSI.fg[c];
      else if(ANSI.bg[c] != null) bg = ANSI.bg[c];
    }
  }
  flush(text.length);
  return out;
}

// ---------------- sidebar sorting (cookie-backed) ----------------
let sortMode = "status";
{
  const m = document.cookie.match(/(?:^|; )sort=(status|ram|disk)/);
  if(m) sortMode = m[1];
}

// ---------------- sidebar search (client-side filter) ----------------
let searchQuery = "";
const searchInput = document.getElementById("searchInput");
searchInput.addEventListener("input", ()=>{
  searchQuery = searchInput.value.trim().toLowerCase();
  renderNav();
});
function appMatches(a, q){
  if(!q) return true;
  if((a.name || "").toLowerCase().includes(q)) return true;
  if(String(a.port).includes(q)) return true;
  if((a.domain || "").toLowerCase().includes(q)) return true;
  return false;
}
const SORTS = {
  // default: running first, then by port (matches the server's sort)
  status: (x,y) => ((x.status?0:1) - (y.status?0:1)) || (x.port - y.port),
  ram:    (x,y) => ((y.mem  != null ? y.mem  : -1) - (x.mem  != null ? x.mem  : -1)) || (x.port - y.port),
  disk:   (x,y) => ((y.disk != null ? y.disk : -1) - (x.disk != null ? x.disk : -1)) || (x.port - y.port),
};
function sortApps(list){
  return list.slice().sort(SORTS[sortMode] || SORTS.status);
}
document.querySelectorAll(".sort-btn").forEach(b=>{
  b.classList.toggle("active", b.dataset.sort === sortMode);
  b.onclick = ()=>{
    sortMode = b.dataset.sort;
    document.cookie = "sort=" + sortMode + ";path=/;max-age=31536000;SameSite=Lax";
    document.querySelectorAll(".sort-btn").forEach(x=>x.classList.toggle("active", x === b));
    renderNav();
  };
});

// ---------------- rendering ----------------
document.getElementById("count").textContent = APPS.length ? `· ${APPS.length}` : "";

function renderNav(){
  // rebuild items: filter by the search box, then sort
  nav.querySelectorAll(".item, .nav-empty").forEach(el=>el.remove());
  const list = sortApps(APPS.filter(a=>appMatches(a, searchQuery)));
  if(APPS.length && !list.length){
    const d = document.createElement("div");
    d.className = "nav-empty";
    d.textContent = "No apps match “" + searchInput.value.trim() + "”";
    nav.appendChild(d);
    return;
  }
  list.forEach(a=>{
    const b = document.createElement("button");
    b.className = "item" + (a.port===selected ? " active":"");
    b.innerHTML =
      `<span class="dot ${a.status?"on":"off"}"></span>` +
      `<span class="item-body">` +
        `<span class="name">${esc(a.name)}</span>` +
        `<span class="stats">${fmtCpu(a.cpu)} · ${fmtMem(a.mem)} · ${fmtMem(a.disk)}</span>` +
      `</span>` +
      `<span class="port">${esc(a.port)}</span>`;
    b.onclick = ()=>select(a.port);
    b.dataset.port = a.port;
    nav.appendChild(b);
  });
  // keep the active item in view (instant; "nearest" = no-op if already visible)
  const act = nav.querySelector(".item.active");
  if(act) act.scrollIntoView({block:"nearest", inline:"nearest"});
}

function renderMain(a){
  if(!a){ main.innerHTML = '<div class="empty">No apps yet.</div>'; current = null; return; }
  current = a;
  main.innerHTML =
    `<div class="card-head">
       <span class="dot ${a.status?"on":"off"}" style="width:11px;height:11px"></span>
       <h2>${esc(a.name)}</h2>
       <span class="badge ${a.status?"on":"off"}">${a.status?"Running":"Stopped"}</span>
       <span class="meta">port ${esc(a.port)}</span>
       <div class="controls">
         <button class="ctl run"    onclick="control('run')">▶ Run</button>
         <button class="ctl stop"   onclick="control('stop')">■ Stop</button>
         <button class="ctl remove" onclick="control('remove')">🗑 Remove</button>
       </div>
       <a class="chatbtn" href="${esc(a.chatUrl)}" target="_blank" rel="noopener">💬 Open chat</a>
       <a class="openbtn" href="${esc(a.url)}" target="_blank" rel="noopener">Open app ↗</a>
     </div>
     <div class="app-row">
       <div class="stat"><span class="lbl">PID</span><span class="val">${a.pid != null ? esc(a.pid) : "—"}</span></div>
       <div class="stat"><span class="lbl">CPU</span><span class="val">${fmtCpu(a.cpu)}</span></div>
       <div class="stat"><span class="lbl">MEM</span><span class="val">${fmtMem(a.mem)}</span></div>
       <div class="stat"><span class="lbl">Disk</span><span class="val">${fmtMem(a.disk)}</span></div>
       <span class="sep"></span>
       <div class="ctrl-group">
         <span class="ctrl-label">Sub</span>
         <input id="domainInput" class="domain-input" type="text"
               value="${esc(a.domain || "")}" placeholder="subdomain" spellcheck="false">
         <button class="domain-save" id="domainSave" onclick="saveDomain()">Save</button>
       </div>
       <span class="sep"></span>
       <div class="ctrl-group">
         <button class="switch${a.public ? " on" : ""}" id="pubToggle" onclick="togglePublic()" aria-pressed="${!!a.public}"></button>
         <span class="pub-label">Public</span>
         <span class="pub-state" id="pubState">${a.public ? "anyone with the link can view" : "owner only"}</span>
       </div>
     </div>
     <div class="section-label">Recent logs</div>
     <pre class="tail" id="tail"></pre>
     <div class="section-label">README</div>
     <div class="card readme" id="readme"></div>`;

  const t = main.querySelector("#tail");
  t.innerHTML = a.tail
    ? ansiToHtml(a.tail)
    : "<span style='color:#5a5f6a'>no log output yet</span>";
  t.scrollTop = t.scrollHeight;

  const rm = main.querySelector("#readme");
  const raw = a.readme || "";
  if(!raw){
    rm.innerHTML = "<span style='color:var(--muted)'>No readme.</span>";
  }else if(typeof marked !== "undefined"){
    const html = marked.parse(raw);
    rm.innerHTML = (typeof DOMPurify !== "undefined") ? DOMPurify.sanitize(html) : html;
  }else{
    rm.textContent = raw;   // CDN unreachable -> show raw markdown as text
  }
}

async function control(action){
  const a = current;
  if(!a) return;
  if(action === "remove" &&
     !confirm(`Remove "${a.name}" (port ${a.port})?\nThis stops it and deletes /apps/${a.port}.`))
    return;

  const btns = [...main.querySelectorAll(".ctl")];
  btns.forEach(b => b.disabled = true);
  try{
    const r = await fetch(a.controlUrl + "/" + action, {method:"GET"});
    if(!r.ok){
      let msg = "HTTP " + r.status;
      try{ const j = await r.json(); if(j && j.error) msg = j.error; }catch(e){}
      alert(msg);
      btns.forEach(b => b.disabled = false);
      return;
    }
    location.reload();
  }catch(e){
    alert("Request failed: " + e.message);
    btns.forEach(b => b.disabled = false);
  }
}

// Subdomain save + public toggle deliberately do NOT reload: they update the
// in-memory app object and the visible UI in place, then toast. Run/stop/remove
// still reload, because they change status/usage/sort-order that only the
// server-side scan can refresh.
async function saveDomain(){
  const a = current;
  if(!a) return;
  const input = document.getElementById("domainInput");
  const domain = input.value.trim();
  const btn = document.getElementById("domainSave");
  btn.disabled = true;
  try{
    // empty value = clear the subdomain; server gets /changeDomain/ with a trailing slash
    const r = await fetch(a.controlUrl + "/changeDomain/" + encodeURIComponent(domain), {method:"GET"});
    if(!r.ok){
      let msg = "HTTP " + r.status;
      try{ const j = await r.json(); if(j && j.error) msg = j.error; }catch(e){}
      showToast(msg, false);
      btn.disabled = false;
      return;
    }
    a.domain = domain;
    input.value = domain;
    btn.disabled = false;
    showToast(domain ? `Subdomain set to "${domain}"` : "Subdomain cleared");
  }catch(e){
    showToast("Request failed: " + e.message, false);
    btn.disabled = false;
  }
}

async function togglePublic(){
  const a = current;
  if(!a) return;
  const next = a.public ? 0 : 1;
  const btn = document.getElementById("pubToggle");
  btn.disabled = true;
  try{
    const r = await fetch(a.controlUrl + "/public/" + next, {method:"GET"});
    if(!r.ok){
      let msg = "HTTP " + r.status;
      try{ const j = await r.json(); if(j && j.error) msg = j.error; }catch(e){}
      showToast(msg, false);
      btn.disabled = false;
      return;
    }
    a.public = !!next;
    btn.classList.toggle("on", a.public);
    btn.setAttribute("aria-pressed", String(a.public));
    document.getElementById("pubState").textContent =
      a.public ? "anyone with the link can view" : "owner only";
    btn.disabled = false;
    showToast(a.public ? "App is now public" : "App is now owner-only");
  }catch(e){
    showToast("Request failed: " + e.message, false);
    btn.disabled = false;
  }
}

function select(port, fromHash){
  selected = port;
  let act = null;
  [...nav.querySelectorAll(".item")].forEach(el=>{
    const on = +el.dataset.port === port;
    el.classList.toggle("active", on);
    if(on) act = el;
  });
  renderMain(APPS.find(x=>x.port===port));
  // auto-scroll the sidebar so the active item is visible ("nearest" = minimal move)
  if(act) act.scrollIntoView({block:"nearest", inline:"nearest", behavior:"smooth"});
  // Keep the URL hash in sync (replaceState: no history spam, no hashchange loop).
  if(!fromHash && location.hash !== "#" + port){
    history.replaceState(null, "", "#" + port);
  }
}

// Manual hash edits / back-forward -> follow the hash.
window.addEventListener("hashchange", ()=>{
  const p = parseInt(location.hash.slice(1), 10);
  if(!isNaN(p) && APPS.some(a=>a.port===p) && p !== selected){
    select(p, true);
  }
});

renderNav();
// On load, honor the hash if it points at a known app; else first running; else first.
const hashPort = parseInt(location.hash.slice(1), 10);
const def = (APPS.find(a=>a.port===hashPort) || APPS.find(a=>a.status) || APPS[0]);
if(def) select(def.port, false);
</script>
</body>
