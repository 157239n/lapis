services:
  lapis:
    restart: always
    build: .
    command: ["./startup1"]
    volumes:
      - ./code:/code:ro
      - ./dbs:/dbs
      - ./code/k1_dbs:/code/k1_dbs
      - ./nginx:/nginx
      - ./log1:/log1
      - ${DATADIR}/merged/topics:/topics
      - ${DATADIR}/tmp:/tmp
      - ${DATADIR}/chatsData:/tmp/chats
      - ${DATADIR}/apps:/apps
    ports:
      - 6510:80
      - 6511:81
    env_file:
      - .env
  central_radon:
    restart: always
    build: .
    command: ["./startup2"]
    volumes:
      - ./code:/code:ro
      - ./central.conf:/central.conf
      - ./log2:/log2
    ports:
      - 40210:40210

